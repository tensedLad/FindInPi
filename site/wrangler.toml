# Cloudflare Pages project. Deploy with: npx wrangler pages deploy
name = "find-in-pi"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[vars]
PI_WIDTH = "10"                # longest searchable number; must match the tables
PI_DIGITS = "100000000000"     # how many digits the tables were built from

[[r2_buckets]]
binding = "PI_TABLES"
bucket_name = "find-in-pi-tables"
