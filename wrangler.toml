# Cloudflare Worker: serves site/public and answers POST /api/find from R2.
# Deploy with: npx wrangler deploy   (Cloudflare's Git builds run this for you)
name = "findinpi"
main = "site/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true             # serve at findinpi.<subdomain>.workers.dev
routes = [
  # Cloudflare creates the DNS record and HTTPS certificate on deploy.
  { pattern = "pi.gokrypt.in", custom_domain = true },
]

[assets]
directory = "site/public"

[vars]
PI_WIDTH = "10"                # longest searchable number; must match the tables
PI_DIGITS = "100000000000"     # how many digits the tables were built from

[[r2_buckets]]
binding = "PI_TABLES"
bucket_name = "find-in-pi-tables"
